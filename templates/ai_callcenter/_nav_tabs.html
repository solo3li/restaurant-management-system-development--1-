<!-- AI Call Center Flat Clean Slate Navigation Bar -->
<div class="border-b border-slate-200/60 pb-3 mb-5 font-sans">
    <div class="flex items-center gap-2 overflow-x-auto text-xs whitespace-nowrap scroll-smooth [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden">
        
        <!-- 1. Live Embedded Call Center Suite (السنترال المباشر) -->
        <a href="{% url 'call_center_embedded' %}" 
           class="inline-flex items-center gap-2 px-3.5 py-2 rounded-lg {% if request.resolver_match.url_name in 'call_center_embedded,call_center,ai_callcenter_overview,ai_callcenter_management' %}bg-violet-50 text-violet-700 font-bold border border-violet-200/70 shadow-xs{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100/70 font-medium border border-transparent{% endif %} transition-all">
            <svg class="w-4 h-4 shrink-0 text-violet-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
            </svg>
            <span>{{ "السنترال المباشر"|t }}</span>
            <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold bg-violet-100 text-violet-700">Live</span>
        </a>

        <!-- 2. Embedded WhatsApp Chat Hub (صندوق الواتساب) -->
        <a href="{% url 'chat_hub_page' %}" 
           data-chat-hub-embedded="{% url 'chat_hub_embedded' %}"
           class="inline-flex items-center gap-2 px-3.5 py-2 rounded-lg {% if request.resolver_match.url_name in 'chat_hub_page,whatsapp_page,chat_hub_embedded,ai_callcenter_omnichannel' %}bg-emerald-50 text-emerald-800 font-bold border border-emerald-200/80 shadow-xs{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100/70 font-medium border border-transparent{% endif %} transition-all">
            <svg class="w-4 h-4 shrink-0 fill-[#25D366]" viewBox="0 0 24 24">
                <path d="M17.472 14.382c-.301-.15-1.78-.878-2.056-.978-.276-.101-.477-.15-.678.15-.201.3-.778.978-.954 1.179-.176.2-.351.226-.652.075-.301-.15-1.272-.469-2.423-1.496-.895-.798-1.5-1.783-1.676-2.084-.175-.301-.019-.464.132-.614.136-.135.301-.351.452-.527.15-.175.201-.3.301-.501.101-.2.051-.376-.025-.527-.075-.15-.678-1.634-.929-2.239-.244-.589-.493-.509-.678-.519-.176-.01-.376-.01-.577-.01-.201 0-.527.075-.803.376s-1.054 1.029-1.054 2.509 1.079 2.91 1.229 3.111c.15.201 2.123 3.242 5.143 4.547.718.311 1.279.497 1.716.636.721.23 1.377.198 1.896.12.578-.088 1.78-.727 2.031-1.429.251-.702.251-1.304.176-1.429-.076-.125-.276-.201-.577-.351z"/>
                <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 1.89.525 3.66 1.438 5.168L2 22l4.98-1.399A9.957 9.957 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm0 18.167c-1.57 0-3.04-.45-4.29-1.233l-.307-.19-2.96.831.849-2.883-.2-.317A8.13 8.13 0 013.833 12c0-4.502 3.665-8.167 8.167-8.167s8.167 3.665 8.167 8.167-3.665 8.167-8.167 8.167z"/>
            </svg>
            <span>{{ "صندوق الواتساب"|t }}</span>
            <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold bg-emerald-100 text-emerald-700">Hub</span>
        </a>

    </div>
</div>
