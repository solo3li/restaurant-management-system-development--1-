<script>
    const CURRENT_LANG = "{{ CURRENT_LANG|default:'ar' }}";
    function tJs(key, fallback) {
        if (window.DiyafaI18n && typeof window.DiyafaI18n.translate === 'function') {
            const res = window.DiyafaI18n.translate(key);
            if (res && res !== key) return res;
        }
        return fallback !== undefined ? fallback : key;
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    function showNotification(msg, isError = false) {
        const toast = document.createElement('div');
        toast.className = `fixed bottom-5 {% if IS_RTL %}left-5{% else %}right-5{% endif %} z-50 flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-2xl border text-xs font-bold transition-all transform duration-300 ${
            isError ? 'bg-rose-900/90 text-rose-100 border-rose-500/50' : 'bg-[#0E382A]/95 text-[#FAF5EC] border-[#D2AB6B]/60'
        }`;
        const iconHtml = isError 
            ? '<svg class="w-4 h-4 text-rose-300 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>'
            : '<svg class="w-4 h-4 text-emerald-300 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';
        toast.innerHTML = `
            ${iconHtml}
            <span>${msg}</span>
        `;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(10px)';
            setTimeout(() => toast.remove(), 300);
        }, 3500);
    }

    function copyTextToClipboard(text, successMsg = null) {
        const msg = successMsg || tJs('تم النسخ بنجاح', 'Copied successfully');
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(() => {
                showNotification(msg);
            }).catch(() => fallbackCopy(text, msg));
        } else {
            fallbackCopy(text, msg);
        }
    }

    function fallbackCopy(text, successMsg) {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.position = 'fixed';
        textArea.style.left = '-9999px';
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
            document.execCommand('copy');
            showNotification(successMsg);
        } catch (err) {
            showNotification(tJs('تعذر النسخ التلقائي', 'Automatic copying failed'), true);
        }
        document.body.removeChild(textArea);
    }

    async function toggleMasterStatus() {
        const btn = document.getElementById('master-status-btn');
        const dot = document.getElementById('master-status-dot');
        const text = document.getElementById('master-status-text');
        if (!dot) return;

        const currentlyActive = dot.classList.contains('bg-emerald-400') || dot.classList.contains('bg-emerald-500');
        const newStatus = !currentlyActive;

        try {
            const res = await fetch("{% url 'api_ai_callcenter_update_profile' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken') || '{{ csrf_token }}'
                },
                body: JSON.stringify({ is_active: newStatus })
            });
            const data = await res.json();
            if (data.status === 'success') {
                if (newStatus) {
                    dot.className = 'h-2.5 w-2.5 rounded-full bg-emerald-400 animate-pulse';
                    if (btn) btn.className = 'px-3.5 py-2 rounded-xl border text-xs font-semibold transition flex items-center gap-2 shadow-xs bg-emerald-500/20 text-emerald-300 border-emerald-400/40 hover:bg-emerald-500/30';
                    if (text) text.textContent = tJs('المساعد: مُفعّل ويستقبل المكالمات', 'Assistant: Active and receiving calls');
                    showNotification(tJs('تم تفعيل استقبال المكالمات للمساعد الصوتي', 'Voice assistant calls activated'));
                } else {
                    dot.className = 'h-2.5 w-2.5 rounded-full bg-rose-400';
                    if (btn) btn.className = 'px-3.5 py-2 rounded-xl border text-xs font-semibold transition flex items-center gap-2 shadow-xs bg-rose-500/20 text-rose-300 border-rose-400/40 hover:bg-rose-500/30';
                    if (text) text.textContent = tJs('المساعد: موقوف مؤقتاً', 'Assistant: Paused temporarily');
                    showNotification(tJs('تم إيقاف المساعد الصوتي مؤقتاً', 'Voice assistant paused temporarily'));
                }
            } else {
                showNotification(data.message || tJs('حدث خطأ أثناء تعديل الحالة', 'Error modifying status'), true);
            }
        } catch (e) {
            showNotification(tJs('تعذر الاتصال بالسيرفر', 'Could not connect to server'), true);
        }
    }

    async function syncVoiceCaps() {
        const btn = document.getElementById('sync-caps-btn');
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = `<div class="w-3.5 h-3.5 border-2 border-current border-t-transparent rounded-full animate-spin"></div> <span>${tJs('جاري المزامنة...', 'Syncing...')}</span>`;
        }
        showNotification(tJs('جاري مزامنة سقف الدقائق مع خادم الاتصالات...', 'Syncing minutes limit with telephony server...'));
        try {
            const res = await fetch("{% url 'api_ai_callcenter_sync_caps' %}", {
                method: "POST",
                headers: {
                    "X-CSRFToken": getCookie('csrftoken') || '{{ csrf_token }}',
                    "Content-Type": "application/json"
                }
            });
            const data = await res.json();
            if (data.status === 'success') {
                showNotification(tJs('تمت مزامنة حصة وسقف الدقائق بنجاح!', 'Minutes quota synced successfully!'));
                setTimeout(() => window.location.reload(), 1200);
            } else {
                showNotification(data.message || tJs('تعذر المزامنة مع خادم الاتصالات', 'Could not sync with telephony server'), true);
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg> <span>${tJs('مزامنة الحصة الصوتية', 'Sync Voice Quota')}</span>`;
                }
            }
        } catch (e) {
            showNotification(tJs('حدث خطأ في الاتصال أثناء المزامنة', 'Connection error during sync'), true);
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg> <span>${tJs('مزامنة الحصة الصوتية', 'Sync Voice Quota')}</span>`;
            }
        }
    }
</script>
