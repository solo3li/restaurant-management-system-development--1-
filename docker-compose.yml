services:
  traefik:
    image: traefik:latest
    container_name: motaem_traefik
    restart: unless-stopped
    command:
      - "--api.insecure=false"
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik_data/acme.json:/letsencrypt/acme.json"
      - "./traefik_data/voice_dynamic.yml:/etc/traefik/dynamic/voice_dynamic.yml:ro"
    networks:
      - motaem_network
      - test-calll-ai_voice_net

  db:
    image: postgres:16-alpine
    container_name: motaem_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - motaem_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: motaem_web
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - motaem_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=motaem_motaem_network"

      # Middleware: Redirect HTTP to HTTPS
      - "traefik.http.middlewares.motaem-redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.motaem-redirect-https.redirectscheme.permanent=true"

      # Security Headers Middleware
      - "traefik.http.middlewares.motaem-sec-headers.headers.sslredirect=true"
      - "traefik.http.middlewares.motaem-sec-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.motaem-sec-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.motaem-sec-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.motaem-sec-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.motaem-sec-headers.headers.contentTypeNosniff=true"

      # Middleware: Canonical Redirect from IP or www or HTTP to https://uggu.space
      - "traefik.http.middlewares.motaem-canonical-redirect.redirectregex.regex=^(?:http://(?:169\\.58\\.32\\.179|www\\.uggu\\.space|uggu\\.space)|https://www\\.uggu\\.space)/(.*)"
      - "traefik.http.middlewares.motaem-canonical-redirect.redirectregex.replacement=https://uggu.space/$${1}"
      - "traefik.http.middlewares.motaem-canonical-redirect.redirectregex.permanent=true"

      # Router: Direct IP access (Auto-Redirects to https://uggu.space)
      - "traefik.http.routers.motaem-direct.rule=Host(`169.58.32.179`)"
      - "traefik.http.routers.motaem-direct.entrypoints=web"
      - "traefik.http.routers.motaem-direct.service=motaem"
      - "traefik.http.routers.motaem-direct.middlewares=motaem-canonical-redirect"

      # Router: HTTP for uggu.space & www (Redirects to https://uggu.space)
      - "traefik.http.routers.motaem-http.rule=Host(`uggu.space`) || Host(`www.uggu.space`)"
      - "traefik.http.routers.motaem-http.entrypoints=web"
      - "traefik.http.routers.motaem-http.service=motaem"
      - "traefik.http.routers.motaem-http.middlewares=motaem-canonical-redirect"


      # Router: HTTPS for uggu.space (SSL via Let's Encrypt)
      - "traefik.http.routers.motaem-https.rule=Host(`uggu.space`)"
      - "traefik.http.routers.motaem-https.entrypoints=websecure"
      - "traefik.http.routers.motaem-https.service=motaem"
      - "traefik.http.routers.motaem-https.tls=true"
      - "traefik.http.routers.motaem-https.tls.certresolver=myresolver"
      - "traefik.http.routers.motaem-https.middlewares=motaem-sec-headers"

      # Router: HTTPS for www.uggu.space (Redirects to https://uggu.space)
      - "traefik.http.routers.motaem-www-https.rule=Host(`www.uggu.space`)"
      - "traefik.http.routers.motaem-www-https.entrypoints=websecure"
      - "traefik.http.routers.motaem-www-https.service=motaem"
      - "traefik.http.routers.motaem-www-https.tls=true"
      - "traefik.http.routers.motaem-www-https.tls.certresolver=myresolver"
      - "traefik.http.routers.motaem-www-https.middlewares=motaem-canonical-redirect"

      # Target Service
      - "traefik.http.services.motaem.loadbalancer.server.port=8000"

  minio:
    image: minio/minio:latest
    container_name: motaem_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9200:9000"
      - "127.0.0.1:9201:9001"
    networks:
      - motaem_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=motaem_motaem_network"

      # Middleware: Replace /media/ with /motaem-media/
      - "traefik.http.middlewares.motaem-minio-replacepath.replacepathregex.regex=^/media/(.*)"
      - "traefik.http.middlewares.motaem-minio-replacepath.replacepathregex.replacement=/motaem-media/$${1}"

      # Router: HTTPS for uggu.space/media/*
      - "traefik.http.routers.motaem-minio-media.rule=Host(`uggu.space`) && PathPrefix(`/media/`)"
      - "traefik.http.routers.motaem-minio-media.entrypoints=websecure"
      - "traefik.http.routers.motaem-minio-media.service=motaem-minio"
      - "traefik.http.routers.motaem-minio-media.tls=true"
      - "traefik.http.routers.motaem-minio-media.tls.certresolver=myresolver"
      - "traefik.http.routers.motaem-minio-media.middlewares=motaem-minio-replacepath,motaem-sec-headers"
      - "traefik.http.routers.motaem-minio-media.priority=100"

      # Router: HTTP for uggu.space/media/*
      - "traefik.http.routers.motaem-minio-media-http.rule=(Host(`uggu.space`) || Host(`www.uggu.space`)) && PathPrefix(`/media/`)"
      - "traefik.http.routers.motaem-minio-media-http.entrypoints=web"
      - "traefik.http.routers.motaem-minio-media-http.middlewares=motaem-canonical-redirect"
      - "traefik.http.routers.motaem-minio-media-http.service=motaem-minio"
      - "traefik.http.routers.motaem-minio-media-http.priority=100"

      # Target Service on port 9000
      - "traefik.http.services.motaem-minio.loadbalancer.server.port=9000"

  minio-init:
    image: minio/mc:latest
    container_name: motaem_minio_init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin123} && /usr/bin/mc ready myminio; do
        echo 'Waiting for MinIO readiness...';
        sleep 2;
      done;
      /usr/bin/mc mb --ignore-existing myminio/motaem-media;
      /usr/bin/mc anonymous set download myminio/motaem-media;
      echo 'MinIO motaem-media bucket initialized successfully.';
      exit 0;
      "
    networks:
      - motaem_network
    restart: "no"


  inngest:
    image: inngest/inngest:latest
    container_name: motaem_inngest
    restart: unless-stopped
    command: "inngest dev -u http://web:8000/api/inngest/ --host 0.0.0.0"
    ports:
      - "8488:8288"
    networks:
      - motaem_network
    depends_on:
      - web

  centrifugo:
    image: centrifugal/centrifugo:v5
    container_name: motaem_centrifugo
    restart: unless-stopped
    command: centrifugo -c /centrifugo/config.json
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro
    ports:
      - "127.0.0.1:9300:8000"
    networks:
      - motaem_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=motaem_motaem_network"

      # Router: HTTPS for uggu.space/connection/*
      - "traefik.http.routers.motaem-centrifugo.rule=Host(`uggu.space`) && (PathPrefix(`/connection/`) || PathPrefix(`/emulation`))"
      - "traefik.http.routers.motaem-centrifugo.entrypoints=websecure"
      - "traefik.http.routers.motaem-centrifugo.service=motaem-centrifugo"
      - "traefik.http.routers.motaem-centrifugo.tls=true"
      - "traefik.http.routers.motaem-centrifugo.tls.certresolver=myresolver"
      - "traefik.http.routers.motaem-centrifugo.middlewares=motaem-sec-headers"
      - "traefik.http.routers.motaem-centrifugo.priority=100"

      # Router: HTTP for uggu.space/connection/*
      - "traefik.http.routers.motaem-centrifugo-http.rule=(Host(`uggu.space`) || Host(`www.uggu.space`)) && (PathPrefix(`/connection/`) || PathPrefix(`/emulation`))"
      - "traefik.http.routers.motaem-centrifugo-http.entrypoints=web"
      - "traefik.http.routers.motaem-centrifugo-http.middlewares=motaem-canonical-redirect"
      - "traefik.http.routers.motaem-centrifugo-http.service=motaem-centrifugo"
      - "traefik.http.routers.motaem-centrifugo-http.priority=100"

      # Target Service on port 8000
      - "traefik.http.services.motaem-centrifugo.loadbalancer.server.port=8000"

volumes:
  postgres_data:
  media_data:
  minio_data:

networks:
  motaem_network:
    driver: bridge
  test-calll-ai_voice_net:
    external: true
