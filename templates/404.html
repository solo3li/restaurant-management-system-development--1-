{% extends "base.html" %}

{% block title %}الصفحة غير موجودة (404) | كُـورَا{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full text-center bg-white rounded-2xl shadow-xl p-8 border border-amber-100">
        <div class="w-20 h-20 bg-amber-50 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl shadow-inner border border-amber-200">
            🔍
        </div>
        <h1 class="text-4xl font-extrabold text-stone-800 mb-2 font-display">404</h1>

            </a>
            <a href="javascript:history.back()" class="inline-flex items-center justify-center px-5 py-3 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700 font-semibold text-sm transition-all duration-200">

    </div>
