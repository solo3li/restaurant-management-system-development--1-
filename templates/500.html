{% extends "base.html" %}

{% block title %}حدث خطأ في الخادم (500) | كُـورَا{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full text-center bg-white rounded-2xl shadow-xl p-8 border border-rose-100">
        <div class="w-20 h-20 bg-rose-50 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl shadow-inner border border-rose-200">
            ⚠️
        </div>
        <h1 class="text-4xl font-extrabold text-stone-800 mb-2 font-display">500</h1>
        <h2 class="text-xl font-bold text-stone-700 mb-3">عذراً، حدث خطأ غير متوقع</h2>
        <p class="text-stone-500 text-sm mb-8 leading-relaxed">
            حدث خطأ داخلي أثناء معالجة طلبك في الخادم. تم تسجيل الحدث وجارٍ التعامل معه لحله بأسرع وقت.
        </p>
        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <a href="{% url 'dashboard' %}" class="inline-flex items-center justify-center px-6 py-3 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-bold text-sm shadow-md shadow-amber-600/20 transition-all duration-200">
                {{ "العودة للرئيسية"|t }}
            </a>
            <button onclick="window.location.reload()" class="inline-flex items-center justify-center px-5 py-3 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700 font-semibold text-sm transition-all duration-200">
                إعادة المحاولة
            </button>
        </div>
    </div>
</div>
{% endblock %}
