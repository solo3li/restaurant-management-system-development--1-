<!-- AI Call Center Flat Clean Slate Navigation Bar -->
<div class="border-b border-slate-200/60 pb-3 mb-5 font-sans">
    <div class="flex items-center gap-1.5 overflow-x-auto text-xs whitespace-nowrap scroll-smooth [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden">
        
        <!-- 1. Overview & Stats -->
        <a href="{% url 'ai_callcenter_overview' %}" 
           class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition-all {% if request.resolver_match.url_name in 'ai_callcenter_overview,ai_callcenter_management' %}bg-violet-50 text-violet-700 font-semibold border border-violet-200/60 shadow-xs{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100/70 font-medium border border-transparent{% endif %}">
            <svg class="w-4 h-4 shrink-0 text-violet-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
            </svg>
            <span>{{ "نظرة عامة"|t }}</span>
        </a>

        <!-- 2. AI Persona & Dialect -->
        <a href="{% url 'ai_callcenter_persona' %}" 
           class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition-all {% if request.resolver_match.url_name == 'ai_callcenter_persona' %}bg-violet-50 text-violet-700 font-semibold border border-violet-200/60 shadow-xs{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100/70 font-medium border border-transparent{% endif %}">
            <svg class="w-4 h-4 shrink-0 text-violet-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z" />
            </svg>
            <span>{{ "شخصية المساعد"|t }}</span>
        </a>

        <!-- 3. Business Hours & Apologies -->
        <a href="{% url 'ai_callcenter_hours' %}" 
           class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition-all {% if request.resolver_match.url_name == 'ai_callcenter_hours' %}bg-violet-50 text-violet-700 font-semibold border border-violet-200/60 shadow-xs{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100/70 font-medium border border-transparent{% endif %}">
            <svg class="w-4 h-4 shrink-0 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>{{ "مواعيد العمل"|t }}</span>
        </a>

        <!-- 4. Knowledge Base (RAG) -->
        <a href="{% url 'ai_callcenter_knowledge' %}" 
           class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition-all {% if request.resolver_match.url_name == 'ai_callcenter_knowledge' %}bg-violet-50 text-violet-700 font-semibold border border-violet-200/60 shadow-xs{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100/70 font-medium border border-transparent{% endif %}">
            <svg class="w-4 h-4 shrink-0 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
            </svg>
            <span>{{ "قاعدة المعرفة"|t }}</span>
        </a>

        <!-- 5. Queues & Transfer Staff -->
        <a href="{% url 'ai_callcenter_queues' %}" 
           class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition-all {% if request.resolver_match.url_name == 'ai_callcenter_queues' %}bg-violet-50 text-violet-700 font-semibold border border-violet-200/60 shadow-xs{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100/70 font-medium border border-transparent{% endif %}">

            <span>{{ "طوابير التحويل"|t }}</span>
        </a>

        <!-- 6. Call Logs & Recordings -->
        <a href="{% url 'ai_callcenter_calls' %}" 
           class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition-all {% if request.resolver_match.url_name == 'ai_callcenter_calls' %}bg-violet-50 text-violet-700 font-semibold border border-violet-200/60 shadow-xs{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100/70 font-medium border border-transparent{% endif %}">

           class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition-all {% if request.resolver_match.url_name == 'ai_callcenter_capabilities' %}bg-violet-50 text-violet-700 font-semibold border border-violet-200/60 shadow-xs{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100/70 font-medium border border-transparent{% endif %}">
            <svg class="w-4 h-4 shrink-0 text-violet-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
            <span>{{ "صلاحيات الذكاء"|t }}</span>
        </a>

        <!-- 8. WhatsApp & Omnichannel -->
        <a href="{% url 'ai_callcenter_omnichannel' %}" 
           class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition-all {% if request.resolver_match.url_name == 'ai_callcenter_omnichannel' %}bg-violet-50 text-violet-700 font-semibold border border-violet-200/60 shadow-xs{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100/70 font-medium border border-transparent{% endif %}">
            <svg class="w-4 h-4 shrink-0 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
            </svg>
            <span>{{ "الواتساب والقنوات"|t }}</span>
        </a>

        <div class="h-4 w-px bg-slate-200 shrink-0 mx-1"></div>

        <!-- 9. Shortcut to Embedded Live Call Center -->
        <a href="{% url 'call_center_embedded' %}" 
           class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg {% if request.resolver_match.url_name == 'call_center_embedded' %}bg-violet-50 text-violet-700 font-semibold border border-violet-200/60 shadow-xs{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100/70 font-medium border border-transparent{% endif %} transition-all">
            <svg class="w-4 h-4 shrink-0 text-violet-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>

        </a>

            <svg class="w-3.5 h-3.5 shrink-0 fill-[#25D366]" viewBox="0 0 24 24">

            </svg>
            <span>{{ "صندوق الواتساب"|t }}</span>
            <span class="inline-flex items-center px-1 py-0.2 rounded text-[9px] font-semibold bg-emerald-100 text-emerald-700">Hub</span>
        </a>

    </div>
</div>
